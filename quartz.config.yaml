# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Research Progress"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: shawn-xihao-wu.github.io/research-progress-2026-summer
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f6f7f4"
        lightgray: "#dde4dd"
        gray: "#8c9a94"
        darkgray: "#36433f"
        dark: "#17211f"
        secondary: "#2b6770"
        tertiary: "#a55b3a"
        highlight: rgba(43, 103, 112, 0.12)
        textHighlight: "#f4d06f66"
      darkMode:
        light: "#111615"
        lightgray: "#27312e"
        gray: "#83918c"
        darkgray: "#d6ded9"
        dark: "#f3f6f1"
        secondary: "#8cc8c0"
        tertiary: "#e2a176"
        highlight: rgba(140, 200, 192, 0.14)
        textHighlight: "#b88d3d66"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    options:
      enableSmartyPants: false
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: mathjax
      customMacros:
        "set": ["\\left\\{ #1 \\right\\}", 1]
        "angl": ["\\left\\langle #1 \\right\\rangle", 1]
        "pare": ["\\left( #1 \\right)", 1]
        "brac": ["\\left[ #1 \\right]", 1]
        "abs": ["\\left\\lvert #1 \\right\\rvert", 1]
        "norm": ["\\left\\lVert #1 \\right\\rVert", 1]
        "ip": ["\\left\\langle #1,#2 \\right\\rangle", 2]
        "opb": ["\\mathbb{B}[#1; #2)", 2]
        "clb": ["\\mathbb{B}[#1; #2]", 2]
        "dopb": ["\\mathbb{B}(#1; #2)", 2]
        "restrict": "\\!\\upharpoonright"
